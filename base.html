<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Retro Rack{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="topbar"><a class="brand" href="{{ url_for('home') }}">RETRO RACK</a><nav><a href="{{ url_for('home') }}">Shop</a><a href="{{ url_for('cart') }}">🛒 Cart <span class="count">{{ cart_count }}</span></a><a href="{{ url_for('admin_login') }}">Admin</a></nav></header>
{% with messages = get_flashed_messages() %}{% if messages %}<div class="flash">{% for message in messages %}<p>{{ message }}</p>{% endfor %}</div>{% endif %}{% endwith %}
<main>{% block content %}{% endblock %}</main><footer>© Retro Rack · Useful finds for every home</footer></body></html>
